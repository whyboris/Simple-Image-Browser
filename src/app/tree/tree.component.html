<ul>

  @for(eachChild of tree; track eachChild; let i = $index;) {
    <li>
      <div class="name" (click)="folderClicked(eachChild)">
        <span [class]="{ selected : selected() }" >
          {{ eachChild.name }}
        </span>
      </div>

      @if (eachChild.children.length) {
        <tree-view [tree]="eachChild.children" (messageEvent)="sendMessage($event)"></tree-view>
      }

    </li>
  }

</ul>
