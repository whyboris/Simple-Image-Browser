@for(path of pathList; track path; let i = $index;) {

  @if (path.display) {

    <div>

      @if (path.hasChildren) {
        <span class="expand-icon" (click)="expand(path)">
          {{ path.expanded ? "-" : "+" }}
        </span>
      }

      <span class="folder-name" [class]="{ selected: path.selected }" [style]="{ marginLeft: path.depth * 16 + 'px' }" (click)="clicked(path)">
        {{ path.path | dir }}
      </span>

    </div>

  }

}
